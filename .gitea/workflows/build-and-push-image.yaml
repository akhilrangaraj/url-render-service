name: Build And Push Image

on:
  push:
    branches:
      - "**"
    tags:
      - "*"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  docker:
    runs-on: ubuntu-24.04
    container:
      image: docker.gitea.com/runner-images:ubuntu-24.04
      volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Build And Push
        env:
          GIT_REF: ${{ github.ref }}
          GIT_REF_NAME: ${{ github.ref_name }}
          GIT_SHA: ${{ github.sha }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          REGISTRY_USER: ${{ secrets.REGISTRY_USER }}
          REGISTRY_PASS: ${{ secrets.REGISTRY_PASS }}
        run: |
          set -eu

          ref_slug="$(printf '%s' "${GIT_REF_NAME}" | tr '[:upper:]' '[:lower:]' | sed 's#[^a-z0-9_.-]#-#g')"
          short_sha="$(printf '%s' "${GIT_SHA}" | cut -c1-12)"
          image_ref="registry.rangaraj.net/akhilrangaraj/url-render-service"

          printf '%s' "${REGISTRY_PASS}" | docker login -u "${REGISTRY_USER}" registry.rangaraj.net --password-stdin
          docker build -t "${image_ref}:${short_sha}" .
          docker tag "${image_ref}:${short_sha}" "${image_ref}:${ref_slug}"

          docker push "${image_ref}:${short_sha}"
          docker push "${image_ref}:${ref_slug}"

          if [ "${GIT_REF}" = "refs/heads/${DEFAULT_BRANCH}" ]; then
            docker tag "${image_ref}:${short_sha}" "${image_ref}:latest"
            docker push "${image_ref}:latest"
          fi
