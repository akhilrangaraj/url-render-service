# Example only -- do NOT commit real keys.
#
# Option A: let scripts/deploy.sh generate a secret with a fresh random key.
# Option B: create your own (e.g. `cp k8s/secret.example.yaml secret.yaml`),
# replace CHANGE_ME with a real key for each user (comma-separated
# `user:key` pairs), then `kubectl -n browsers apply -f secret.yaml`
# BEFORE deploying.
apiVersion: v1
kind: Secret
metadata:
  name: url-render-auth
  namespace: browsers
type: Opaque
stringData:
  api-keys: "alice:CHANGE_ME"
