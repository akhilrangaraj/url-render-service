apiVersion: v1
kind: Service
metadata:
  name: url-render
  namespace: url-render
  labels:
    app: url-render
spec:
  # ClusterIP only -- you reach this via `kubectl port-forward`, not from outside.
  type: ClusterIP
  selector:
    app: url-render
  ports:
    - name: http
      port: 8000
      targetPort: http
      protocol: TCP
